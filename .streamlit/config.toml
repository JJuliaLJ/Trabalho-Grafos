[theme]
base = "light"
primaryColor = "#0d7480"
backgroundColor = "#f7f9fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#1f3038"
borderColor = "#d8dfe2"
baseRadius = "8px"
baseFontSize = 14
showWidgetBorder = true
font = "'Hanken Grotesk':https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap, sans-serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
